<!-- Contact Form Modal -->
<div id="contactModal" class="modal" style="display: none;">
    <div class="modal-content">
        <span class="close-btn" onclick="closeContactForm()">&times;</span>
        <h2>Contact Us</h2>
        <form id="contactForm" onsubmit="submitContactForm(event)">
            <div class="form-group">
                <label for="contactName">Your Name:</label>
                <input type="text" id="contactName" name="name" required>
            </div>
            <div class="form-group">
                <label for="contactEmail">Your Email:</label>
                <input type="email" id="contactEmail" name="email" required>
            </div>
            <div class="form-group">
                <label for="contactSubject">Subject:</label>
                <input type="text" id="contactSubject" name="subject" required>
            </div>
            <div class="form-group">
                <label for="contactMessage">Message:</label>
                <textarea id="contactMessage" name="message" rows="6" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Send Message</button>
        </form>
    </div>
</div>

<script>
// Initialize hero and footer on all pages
document.addEventListener('DOMContentLoaded', function() {
    initializeHeroAndFooter();
});

function initializeHeroAndFooter() {
    // Only add hero/footer if not already present
    if (!document.querySelector('.hero-section')) {
        const heroTemplate = document.getElementById('hero-template');
        if (heroTemplate && document.body) {
            document.body.insertBefore(
                heroTemplate.content.cloneNode(true),
                document.body.firstChild
            );
        }
    }
    
    if (!document.querySelector('.footer-section')) {
        const footerTemplate = document.getElementById('footer-template');
        if (footerTemplate && document.body) {
            document.body.appendChild(footerTemplate.content.cloneNode(true));
        }
    }
}

function showContactForm() {
    document.getElementById('contactModal').style.display = 'block';
}

function closeContactForm() {
    document.getElementById('contactModal').style.display = 'none';
}

function showTermsOfService() {
    alert('Terms of Service:\n\n1. Use this platform for legitimate research only.\n2. Do not submit malicious or spam content.\n3. Results are provided as-is without warranty.\n4. By using this service, you agree to these terms.');
}

function showPrivacyPolicy() {
    alert('Privacy Policy:\n\n1. We collect email addresses for job notifications only.\n2. Emails are not shared with third parties.\n3. Analysis results are stored for 30 days.\n4. You can request deletion of your data at any time.');
}

async function submitContactForm(event) {
    event.preventDefault();
    
    const formData = {
        name: document.getElementById('contactName').value,
        email: document.getElementById('contactEmail').value,
        subject: document.getElementById('contactSubject').value,
        message: document.getElementById('contactMessage').value
    };
    
    try {
        const response = await fetch('/api/contact', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(formData)
        });
        
        if (response.ok) {
            alert('Message sent successfully! We will contact you soon.');
            document.getElementById('contactForm').reset();
            closeContactForm();
        } else {
            alert('Failed to send message. Please try again later.');
        }
    } catch (error) {
        console.error('Error sending contact form:', error);
        alert('Error sending message: ' + error.message);
    }
}

// Close modal when clicking outside
window.onclick = function(event) {
    const modal = document.getElementById('contactModal');
    if (event.target == modal) {
        modal.style.display = 'none';
    }
}
</script>
