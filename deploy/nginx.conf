# Nginx configuration for NCLE Web Application
# Place this in /etc/nginx/sites-available/nclweb and symlink to sites-enabled

upstream nclweb_backend {
    server 127.0.0.1:8000;
    keepalive 64;
}

# Rate limiting zone - 10 requests per minute per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/m;

# HTTP server - redirects to HTTPS
server {
    listen 80;
    server_name your_domain.com www.your_domain.com;  # Change to your domain
    
    # Allow Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name your_domain.com www.your_domain.com;  # Change to your domain
    
    # SSL certificate paths (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/your_domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your_domain.com/privkey.pem;
    
    # SSL configuration (modern, secure settings)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Max upload size for PDB files (50MB + overhead)
    client_max_body_size 60M;
    
    # Root directory for static files
    root /home/ianms/git_repos/NCLEweb;
    index index.html;
    
    # Serve static files directly
    location / {
        try_files $uri $uri/ =404;
    }
    
    # Proxy API requests to FastAPI backend
    location /api/ {
        # Apply rate limiting to API endpoints
        limit_req zone=api_limit burst=5 nodelay;
        limit_req_status 429;
        
        proxy_pass http://nclweb_backend;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Timeouts (increase for long-running jobs)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Buffering settings
        proxy_buffering off;
        proxy_request_buffering off;
    }
    
    # Serve data files (results, PDB files)
    location /data/ {
        alias /home/ianms/git_repos/NCLEweb/data/;
        
        # Prevent execution of any scripts
        location ~ \.(php|py|sh|pl)$ {
            deny all;
        }
        
        # CORS headers for JSON data files
        location ~ \.json$ {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";
        }
    }
    
    # Access and error logs
    access_log /var/log/nginx/nclweb_access.log;
    error_log /var/log/nginx/nclweb_error.log;
}
