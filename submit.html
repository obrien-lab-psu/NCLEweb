<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Analysis - NCLE</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .submit-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        
        .submit-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .submit-header h1 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .submit-header p {
            color: #666;
            font-size: 1.1em;
        }
        
        .submit-form {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        .form-group label .required {
            color: #e74c3c;
        }
        
        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            font-family: inherit;
            box-sizing: border-box;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .form-group input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 2px dashed #ddd;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .form-group small {
            display: block;
            margin-top: 5px;
            color: #666;
            font-size: 0.9em;
        }
        
        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        
        .btn {
            flex: 1;
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
        }
        
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #d0d0d0;
        }
        
        .status-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }
        
        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status-message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
</head>
<body>
    <div class="submit-container">
        <div class="submit-header">
            <h1>Submit Analysis</h1>
            <p>Fill out the form below to analyze your PDB structure</p>
        </div>
        
        <form id="submitForm" class="submit-form">
            <div class="form-group">
                <label for="email">
                    Email Address <span class="required">*</span>
                </label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    required 
                    placeholder="your.email@example.com"
                >
                <small>You'll receive a notification when analysis is complete</small>
            </div>
            
            <div class="form-group">
                <label for="jobName">
                    Job Name <span class="required">*</span>
                </label>
                <input 
                    type="text" 
                    id="jobName" 
                    name="jobName" 
                    required 
                    placeholder="My Protein Analysis"
                    maxlength="200"
                >
                <small>A descriptive name for this analysis</small>
            </div>
            
            <div class="form-group">
                <label for="uniprotId">
                    Uniprot ID (optional)
                </label>
                <input 
                    type="text" 
                    id="uniprotId" 
                    name="uniprotId" 
                    placeholder="P12345"
                    maxlength="50"
                >
                <small>If your protein has a Uniprot identifier</small>
            </div>
            
            <div class="form-group">
                <label for="description">
                    Description (optional)
                </label>
                <textarea 
                    id="description" 
                    name="description" 
                    placeholder="Additional notes about this structure..."
                    maxlength="1000"
                ></textarea>
                <small>Any additional information about this analysis</small>
            </div>
            
            <div class="form-group">
                <label for="pdbFile">
                    PDB File <span class="required">*</span>
                </label>
                <input 
                    type="file" 
                    id="pdbFile" 
                    name="file" 
                    accept=".pdb" 
                    required
                >
                <small>Maximum file size: 20 MB</small>
            </div>
            
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="window.location.href='landing.html'">
                    Cancel
                </button>
                <button type="submit" class="btn btn-primary" id="submitBtn">
                    Submit Analysis
                </button>
            </div>
            
            <div id="statusMessage" class="status-message"></div>
        </form>
    </div>
    
    <script>
        const API_BASE_URL = 'http://localhost:8000';
        const form = document.getElementById('submitForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');
        
        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = `status-message ${type}`;
            statusMessage.style.display = 'block';
        }
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Disable submit button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';
            
            // Get form data
            const formData = new FormData();
            formData.append('email', document.getElementById('email').value);
            formData.append('job_name', document.getElementById('jobName').value);
            formData.append('uniprot_id', document.getElementById('uniprotId').value);
            formData.append('description', document.getElementById('description').value);
            formData.append('file', document.getElementById('pdbFile').files[0]);
            
            try {
                showStatus('Uploading and submitting job...', 'info');
                
                const response = await fetch(`${API_BASE_URL}/api/submit-job`, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    showStatus(
                        `Success! Job submitted with ID: ${data.job_id}. You will receive an email when processing is complete.`,
                        'success'
                    );
                    
                    // Redirect to browse page after 3 seconds
                    setTimeout(() => {
                        window.location.href = `browse.html?highlight=${data.job_id}`;
                    }, 3000);
                } else {
                    showStatus(`Error: ${data.detail || 'Submission failed'}`, 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Submit Analysis';
                }
                
            } catch (error) {
                console.error('Submission error:', error);
                showStatus(`Error: ${error.message}`, 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Analysis';
            }
        });
    </script>
</body>
</html>
